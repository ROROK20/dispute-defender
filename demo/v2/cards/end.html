<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End card</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Scene Z, held 5 s. Frame-stepped like the title card. No third-party logos:
     the repo line is plain text. The bottom 170 px are left for the caption. */
  .wrap {
    position: absolute;
    inset: 0 0 170px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 30px; animation: rise 800ms cubic-bezier(.16,1,.3,1) 60ms both; }
  .mark { width: 104px; height: 104px; font-size: 60px; }
  h1 { margin: 0; font-size: 100px; font-weight: 760; letter-spacing: -0.025em; line-height: 1; }
  .tagline {
    margin-top: 44px;
    font-size: 52px;
    font-weight: 650;
    letter-spacing: -0.015em;
    animation: rise 800ms cubic-bezier(.16,1,.3,1) 300ms both;
  }
  .tagline span { color: var(--teal-bright); }
  .repo {
    margin-top: 48px;
    display: inline-flex; align-items: center; gap: 16px;
    padding: 18px 30px 19px 24px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(45,212,191,0.35), 0 14px 40px rgba(0,0,0,0.25);
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.01em;
    animation: rise 800ms cubic-bezier(.16,1,.3,1) 550ms both;
  }
  .line {
    margin-top: 40px;
    max-width: 1500px;
    text-align: center;
    font-size: 27px;
    line-height: 1.4;
    font-weight: 450;
    color: var(--ink-muted);
    animation: rise 800ms cubic-bezier(.16,1,.3,1) 800ms both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="wrap">
  <div class="brand"><div class="mark">D</div><h1 id="product"></h1></div>
  <div class="tagline" id="tagline"></div>
  <div class="repo">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
    </svg>
    <span id="repo"></span>
  </div>
  <div class="line" id="line"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('product').textContent = q.get('product') || '';
  document.getElementById('repo').textContent = q.get('repo') || '';
  document.getElementById('line').textContent = q.get('line') || '';
  // Second sentence of the tagline in the accent colour.
  const tag = (q.get('tagline') || '').match(/^(.*?\.)\s*(.*)$/);
  const t = document.getElementById('tagline');
  if (tag) {
    const b = document.createElement('span');
    b.textContent = tag[2];
    t.append(document.createTextNode(`${tag[1]} `), b);
  } else t.textContent = q.get('tagline') || '';
  window.DURATION_MS = 1700;
  window.seek = (ms) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
    return true;
  };
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
