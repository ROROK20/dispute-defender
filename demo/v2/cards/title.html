<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title card</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Scene T. Frame-stepped by the renderer: it calls window.seek(ms) for every
     output frame, so the CSS animations below are deterministic. Nothing sits in
     the bottom 170 px, which is the caption strip. */
  .wrap {
    position: absolute;
    inset: 0 0 120px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: drift 4000ms cubic-bezier(.25,.1,.25,1) both;
  }
  .mark {
    width: 132px; height: 132px; font-size: 76px;
    animation: pop 900ms cubic-bezier(.2,1.4,.35,1) 120ms both;
  }
  h1 {
    margin: 46px 0 0;
    font-size: 118px;
    font-weight: 750;
    letter-spacing: -0.025em;
    line-height: 1;
    animation: rise 1100ms cubic-bezier(.16,1,.3,1) 380ms both;
  }
  .rule {
    width: 132px; height: 4px; margin: 38px 0 0; border-radius: 2px;
    background: linear-gradient(90deg, rgba(45,212,191,0) 0%, var(--teal-bright) 50%, rgba(45,212,191,0) 100%);
    transform-origin: 50% 50%;
    animation: grow 900ms cubic-bezier(.16,1,.3,1) 900ms both;
  }
  p {
    margin: 34px 0 0;
    font-size: 38px;
    font-weight: 450;
    color: var(--ink-muted);
    letter-spacing: -0.005em;
    animation: rise 1000ms cubic-bezier(.16,1,.3,1) 1050ms both;
  }
  .sheen {
    position: absolute; inset: 0;
    background: radial-gradient(700px 380px at 50% 44%, rgba(45,212,191,0.16) 0%, rgba(45,212,191,0) 70%);
    animation: glow 2600ms ease-out 200ms both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes grow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
  @keyframes glow { from { opacity: 0; } 40% { opacity: 1; } to { opacity: .55; } }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.025); } }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="sheen"></div>
<div class="wrap">
  <div class="mark">D</div>
  <h1 id="product"></h1>
  <div class="rule"></div>
  <p id="subtitle"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('product').textContent = q.get('product') || '';
  document.getElementById('subtitle').textContent = q.get('subtitle') || '';
  window.DURATION_MS = 4000;
  window.seek = (ms) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
    return true;
  };
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
