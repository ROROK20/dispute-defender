<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Transparent 1920x1080 overlays: one caption cue, the disclosure lower third,
     or the time-lapse badge. The renderer calls window.show(kind, data) and takes
     a transparent screenshot. All three sit in the strip under the product window
     (y >= 936), so they never cover the app. */
  .slot { position: absolute; display: none; }

  #caption {
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    max-width: 960px;
    padding: 9px 24px 11px;
    border-radius: 14px;
    background: rgba(5, 9, 16, 0.66);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    text-align: center;
    font-size: 33px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.003em;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  #disclosure {
    left: 30px;
    bottom: 26px;
    padding: 11px 16px 12px 14px;
    border-radius: 12px;
    background: rgba(5, 9, 16, 0.6);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  #disclosure .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #fbbf24;
    margin-bottom: 5px;
  }
  #disclosure .label i {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.22);
  }
  #disclosure .line { font-size: 16.5px; line-height: 1.34; font-weight: 600; color: var(--ink); white-space: nowrap; }

  #badge {
    right: 30px;
    bottom: 26px;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 12px 18px 12px 14px;
    border-radius: 12px;
    background: rgba(5, 9, 16, 0.6);
    box-shadow: inset 0 0 0 1px rgba(45, 212, 191, 0.35);
    font-size: 21px;
    font-weight: 650;
    letter-spacing: -0.005em;
  }
  #badge svg { flex: none; }
  #badge .sub { color: var(--ink-muted); font-weight: 500; }
</style>
</head>
<body class="transparent">
<div id="caption" class="slot"></div>
<div id="disclosure" class="slot">
  <div class="label"><i></i><span id="disclosure-label"></span></div>
  <div id="disclosure-lines"></div>
</div>
<div id="badge" class="slot">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 5l8 7-8 7z" fill="rgba(45,212,191,.25)"/><path d="M12 5l8 7-8 7z" fill="rgba(45,212,191,.25)"/>
  </svg>
  <span id="badge-main"></span><span id="badge-sub" class="sub"></span>
</div>
<script>
  // Text is always set with textContent: nothing here is parsed as HTML.
  window.show = (kind, data) => {
    for (const s of document.querySelectorAll('.slot')) s.style.display = 'none';
    if (kind === 'caption') {
      const c = document.getElementById('caption');
      c.replaceChildren();
      data.lines.forEach((line, i) => {
        if (i) c.appendChild(document.createElement('br'));
        c.appendChild(document.createTextNode(line));
      });
      c.style.display = 'block';
    } else if (kind === 'disclosure') {
      document.getElementById('disclosure-label').textContent = data.label;
      const box = document.getElementById('disclosure-lines');
      box.replaceChildren(...data.lines.map((t) => {
        const d = document.createElement('div');
        d.className = 'line';
        d.textContent = t;
        return d;
      }));
      document.getElementById('disclosure').style.display = 'block';
    } else if (kind === 'badge') {
      document.getElementById('badge-main').textContent = data.main;
      document.getElementById('badge-sub').textContent = data.sub;
      document.getElementById('badge').style.display = 'flex';
    }
    return true;
  };
  document.body.dataset.ready = '1';
</script>
</body>
</html>
