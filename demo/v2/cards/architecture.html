<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it's built</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Scene K, about 6 s: the main flow only. Every box names a module that
     exists in src/lib, and every PayPal API is one the code calls
     (src/lib/paypal/*). Frame-stepped like T and Z; the bottom 200 px stay clear. */
  .head { position: absolute; left: 150px; top: 92px; animation: rise 600ms cubic-bezier(.16,1,.3,1) 0ms both; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--teal-bright); }
  .title { margin-top: 8px; font-size: 56px; font-weight: 720; letter-spacing: -0.02em; }
  .flow { position: absolute; left: 150px; right: 150px; top: 300px; display: flex; align-items: stretch; gap: 0; }
  .box {
    flex: 1;
    padding: 26px 24px 24px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.045));
    box-shadow: inset 0 0 0 1.5px rgba(148,163,184,0.28), 0 18px 40px rgba(0,0,0,0.3);
    animation: pop 520ms cubic-bezier(.2,1.2,.35,1) both;
  }
  .box.ai { box-shadow: inset 0 0 0 2px rgba(45,212,191,0.6), 0 18px 40px rgba(0,0,0,0.3); }
  .box.code { box-shadow: inset 0 0 0 2px rgba(129,140,248,0.6), 0 18px 40px rgba(0,0,0,0.3); }
  .box.human { box-shadow: inset 0 0 0 2px rgba(251,191,36,0.65), 0 18px 40px rgba(0,0,0,0.3); }
  .tag { font-size: 16px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
  .ai .tag { color: #5eead4; } .code .tag { color: #a5b4fc; } .human .tag { color: #fcd34d; } .plain .tag { color: #cbd5e1; }
  .name { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .arrow { width: 56px; display: flex; align-items: center; justify-content: center; animation: fade 300ms ease-out both; }
  .band {
    position: absolute; left: 150px; right: 150px; top: 610px; height: 150px;
    border-radius: 22px;
    background: rgba(255,255,255,0.04);
    box-shadow: inset 0 0 0 1.5px rgba(148,163,184,0.25);
    display: flex; align-items: center; gap: 22px; padding: 0 30px;
    animation: rise 600ms cubic-bezier(.16,1,.3,1) 1300ms both;
  }
  .band .bname { font-size: 30px; font-weight: 700; margin-right: 10px; }
  .chip { padding: 16px 26px; border-radius: 14px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(148,163,184,0.3); font-size: 30px; font-weight: 650; }
  .fixture { margin-left: auto; font-size: 22px; font-weight: 650; color: #fcd34d; background: rgba(251,191,36,0.13); padding: 9px 18px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(251,191,36,0.45); white-space: nowrap; }
  .link { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="head">
  <div class="eyebrow">Under the hood</div>
  <div class="title">How Dispute Defender is built</div>
</div>
<div class="flow" id="flow"></div>
<div class="band">
  <div class="bname">PayPal REST APIs</div>
  <div class="chip">Disputes</div>
  <div class="chip">Orders v2</div>
  <div class="chip">Webhooks</div>
  <div class="fixture">sandbox-shaped fixtures in this recording</div>
</div>
<script>
  // The main flow, as src/lib wires it: intake, agent, checker, the seller, submission.
  const boxes = [
    { kind: 'plain', tag: 'Intake', name: 'Webhook + poller' },
    { kind: 'ai', tag: 'Claude', name: 'Tool-use agent' },
    { kind: 'code', tag: 'Deterministic', name: 'Citation checker' },
    { kind: 'human', tag: 'Seller', name: 'Approves' },
    { kind: 'code', tag: 'Code', name: 'Submits evidence' },
  ];
  const flow = document.getElementById('flow');
  const arrow = '<svg width="40" height="24" viewBox="0 0 40 24"><path d="M2 12h30M24 4l10 8-10 8" fill="none" stroke="rgba(203,213,225,.85)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  boxes.forEach((b, i) => {
    if (i) {
      const a = document.createElement('div');
      a.className = 'arrow';
      a.innerHTML = arrow;
      a.style.animationDelay = `${200 + i * 170}ms`;
      flow.appendChild(a);
    }
    const e = document.createElement('div');
    e.className = `box ${b.kind}`;
    e.style.animationDelay = `${120 + i * 170}ms`;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = b.tag;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = b.name;
    e.append(tag, name);
    flow.appendChild(e);
  });
  window.DURATION_MS = 2000;
  window.seek = (ms) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
    return true;
  };
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
